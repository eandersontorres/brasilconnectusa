<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Agendar — BrasilConnect USA</title>
  <meta name="description" content="Agende seu horário com profissionais brasileiros no BrasilConnect USA.">
  <meta name="robots" content="index, follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/premium.css">

  <style>
    .pro-cover {
      background: linear-gradient(135deg, var(--brand-green) 0%, var(--brand-green-dark) 100%);
      background-size: cover; background-position: center;
      color: var(--paper);
      padding: 64px 0 80px;
      position: relative;
    }
    .pro-cover .container { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
    .avatar-circle {
      width: 96px; height: 96px; border-radius: 50%;
      background: var(--brand-gold); color: var(--paper);
      background-size: cover; background-position: center;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display); font-size: 2.4rem; font-weight: 700;
      flex-shrink: 0; border: 3px solid var(--paper);
    }
    .avatar-circle.has-photo { color: transparent; }
    .pro-cover h1 { font-family: var(--font-display); font-size: clamp(1.8rem, 4vw, 2.6rem); margin: 0; color: var(--paper); }
    .pro-cover .specialty { font-size: 1rem; opacity: 0.9; margin-top: 4px; }
    .pro-cover .bio { font-size: 0.95rem; opacity: 0.85; margin-top: 8px; max-width: 600px; line-height: 1.6; white-space: pre-line; }
    .cover-links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px;
      background: rgba(255, 255, 255, 0.14); color: var(--paper); font-size: 13px; font-weight: 500;
      text-decoration: none; border: 1px solid rgba(255, 255, 255, 0.18);
    }
    .pill:hover { background: rgba(255, 255, 255, 0.24); color: var(--paper); }
    .pill .gold { color: #F2D27A; }

    .step-eyebrow { text-transform: uppercase; letter-spacing: 0.18em; font-size: 11px; font-weight: 600; color: var(--brand-gold-dark); margin-top: 32px; margin-bottom: 14px; }
    .page-section { margin-top: 48px; }

    .service-card {
      background: var(--paper-elevated); border: 1px solid var(--line);
      border-radius: var(--r-md); padding: 18px 20px; margin-bottom: 12px;
      cursor: pointer; transition: all 0.15s;
    }
    .service-card:hover { border-color: var(--brand-gold); }
    .service-card.static { cursor: default; }
    .service-card.static:hover { border-color: var(--line); }
    .service-card.selected { border-color: var(--brand-green); background: var(--brand-green-soft); }
    .service-card .head { display: flex; justify-content: space-between; gap: 12px; }
    .service-card .name { font-weight: 600; color: var(--ink); }
    .service-card .price { font-family: var(--font-display); font-weight: 700; color: var(--ink); font-size: 1.1rem; }
    .service-card .meta { display: flex; gap: 16px; font-size: 0.85rem; color: var(--ink-muted); margin-top: 6px; }

    .step-progress { display: flex; gap: 8px; margin: 24px 0; }
    .step-dot {
      flex: 1; height: 4px; background: var(--line); border-radius: 2px;
      position: relative;
    }
    .step-dot.active, .step-dot.done { background: var(--brand-green); }

    .slot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; margin: 16px 0; }
    .slot-btn {
      padding: 10px 8px; border: 1px solid var(--line); border-radius: var(--r-sm);
      background: var(--paper-elevated); cursor: pointer;
      font-family: inherit; font-size: 14px; color: var(--ink);
    }
    .slot-btn:hover { border-color: var(--brand-gold); }
    .slot-btn.selected { background: var(--ink); color: var(--paper); border-color: var(--ink); }

    .date-input { padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--r-md); font-size: 14px; font-family: inherit; }

    /* Agenda fechada (plano inativo) */
    .closed-box {
      background: var(--gold-soft); border: 1px solid rgba(184, 148, 59, 0.25); border-radius: var(--r-lg);
      padding: 20px 22px; margin-bottom: 20px; color: var(--ink-soft); font-size: 15px; line-height: 1.55;
    }
    .closed-box strong { color: var(--ink); }
    .btn-whatsapp { background: #25D366; border-color: #25D366; color: #fff; }
    .btn-whatsapp:hover { background: #1EBE5A; border-color: #1EBE5A; color: #fff; }

    /* Galeria */
    .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .gallery-grid button {
      padding: 0; border: 0; background: var(--paper-soft); border-radius: var(--r-md); overflow: hidden;
      aspect-ratio: 1 / 1; cursor: zoom-in; display: block; width: 100%;
    }
    .gallery-grid img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.2s; }
    .gallery-grid button:hover img { transform: scale(1.03); }
    .lightbox {
      position: fixed; inset: 0; z-index: 2147482000; background: rgba(10, 12, 11, 0.92);
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .lightbox img { max-width: 92vw; max-height: 84vh; border-radius: 10px; object-fit: contain; }
    .lightbox button {
      position: absolute; background: rgba(255, 255, 255, 0.12); color: #fff; border: 0; cursor: pointer;
      width: 44px; height: 44px; border-radius: 50%; font-size: 26px; line-height: 44px; font-family: inherit;
    }
    .lightbox button:hover { background: rgba(255, 255, 255, 0.24); }
    .lightbox .lb-close { top: 16px; right: 16px; }
    .lightbox .lb-prev { left: 12px; top: 50%; transform: translateY(-50%); }
    .lightbox .lb-next { right: 12px; top: 50%; transform: translateY(-50%); }
    .lightbox .lb-count { position: absolute; bottom: 18px; left: 0; right: 0; text-align: center; color: rgba(255, 255, 255, 0.75); font-size: 13px; }

    .video-wrap { position: relative; aspect-ratio: 16 / 9; border-radius: var(--r-lg); overflow: hidden; background: var(--ink); }
    .video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

    /* Avaliacoes */
    .rating-summary { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; }
    .rating-summary .big { font-family: var(--font-display); font-size: 2.6rem; font-weight: 700; color: var(--ink); line-height: 1; }
    .stars { color: var(--brand-gold); letter-spacing: 1px; }
    .stars .off { color: var(--line-strong); }
    .review-list { margin-top: 8px; }
    .review-item { padding: 16px 0; border-bottom: 1px solid var(--line-soft); }
    .review-item .stars { margin-bottom: 4px; }
    .review-item .comment { color: var(--ink); font-size: 15px; line-height: 1.55; white-space: pre-line; }
    .review-item .who { font-size: 12px; color: var(--ink-muted); margin-top: 6px; }
    .review-item .reply {
      margin-top: 10px; padding: 10px 14px; background: var(--paper-soft); border-left: 3px solid var(--brand-gold);
      border-radius: 0 var(--r-md) var(--r-md) 0; font-size: 14px; color: var(--ink-soft); line-height: 1.5; white-space: pre-line;
    }
    .review-item .reply b { color: var(--ink); font-weight: 600; }

    .contact-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .pro-foot { text-align: center; font-size: 12px; color: var(--ink-muted); padding: 48px 20px 40px; }
    .pro-foot a { color: var(--brand-green); text-decoration: none; font-weight: 600; }

    /* Pedir orçamento (WorkPro / tipo 'trades') */
    .qf-card { background: var(--paper-elevated); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 22px; }
    .qf-intro { color: var(--ink-soft); font-size: 14.5px; margin: 0 0 16px; line-height: 1.55; }
    .qf-langs { display: inline-flex; gap: 4px; padding: 3px; background: var(--paper-soft); border-radius: 999px; margin-bottom: 16px; }
    .qf-langs button { border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; font: inherit; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); cursor: pointer; }
    .qf-langs button.on { background: var(--paper-elevated); color: var(--ink); box-shadow: var(--shadow-sm); }
    .qf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
    .qf-grid .full { grid-column: 1 / -1; }
    .qf-field label { display: block; font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 5px; }
    .qf-field label small { font-weight: 400; color: var(--ink-muted); }
    .qf-field input, .qf-field textarea {
      width: 100%; padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: var(--r-md);
      font-family: inherit; font-size: 16px; color: var(--ink); background: #fff;
    }
    .qf-field textarea { min-height: 96px; resize: vertical; }
    .qf-field input:focus, .qf-field textarea:focus { outline: 2px solid var(--brand-green); outline-offset: 1px; border-color: transparent; }
    .qf-photos { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    .qf-thumb { position: relative; width: 84px; height: 84px; border-radius: var(--r-md); overflow: hidden; background: var(--paper-soft); }
    .qf-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .qf-thumb button { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: rgba(0, 0, 0, 0.6); color: #fff; cursor: pointer; font-size: 15px; line-height: 24px; padding: 0; }
    .qf-add {
      width: 84px; height: 84px; border-radius: var(--r-md); border: 1.5px dashed var(--line-strong); background: transparent;
      color: var(--ink-soft); font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    }
    .qf-add span { font-size: 22px; line-height: 1; }
    .qf-hp { position: absolute !important; left: -10000px !important; width: 1px; height: 1px; overflow: hidden; }
    .qf-err { color: #9F2D2D; font-size: 13.5px; margin-top: 10px; min-height: 1em; }
    .qf-done { text-align: center; padding: 10px 4px; }
    .qf-done .ok { width: 52px; height: 52px; border-radius: 50%; background: var(--green-soft); color: var(--green-deep); font-size: 26px; line-height: 52px; margin: 0 auto 12px; }
    .qf-done h3 { margin: 0 0 6px; }
    .qf-done p { color: var(--ink-soft); font-size: 14.5px; margin: 0 0 14px; }
    .qf-done .qf-warn { background: var(--gold-soft); color: var(--ink); border-radius: var(--r-md); padding: 10px 14px; font-size: 14px; }

    @media (max-width: 720px) {
      .pro-cover { padding: 44px 0 56px; }
      .gallery-grid { gap: 6px; }
      .qf-grid { grid-template-columns: 1fr; }
      .qf-card { padding: 18px 16px; }
    }
  </style>
  <script src="/js/site.js" defer></script>
</head>
<body>
  <div id="app">
    <p class="muted" style="text-align:center; padding: 60px;">Carregando…</p>
  </div>

  <script>
    const root = document.getElementById('app')
    const escapeHtml = s => String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))
    const fmtUSD = c => '$' + (c / 100).toFixed(2)

    // Pega slug da URL: /agenda/ana-torres ou query ?slug=
    const path = window.location.pathname
    const fromPath = path.match(/\/agenda\/([^\/?]+)/)
    const slug = (fromPath ? fromPath[1] : (new URL(window.location.href).searchParams.get('slug')))?.toLowerCase()

    if (!slug || slug === 'profile.html' || slug === 'review.html') {
      root.innerHTML = '<div style="padding:60px;text-align:center;"><h1>Profissional não encontrada</h1><p><a href="/agenda/">Ver todos os profissionais</a></p></div>'
    } else {
      loadProvider(slug)
    }

    let provider, services, reviews, selected = { service: null, date: null, slot: null }
    // Formulário "Pedir orçamento" (WorkPro): obra, reparo, serviço técnico, tradutor...
    let quoteForm = false

    // So http(s): bloqueia javascript:, data: etc.
    function httpUrl(u) { const s = String(u || '').trim(); return /^https?:\/\//i.test(s) ? s : '' }

    // Data LOCAL da cliente (toISOString dava o dia seguinte a noite nos EUA)
    const pad2 = n => String(n).padStart(2, '0')
    const localKey = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`
    const WD = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb']
    const MO = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez']
    function fmtDateBR(key) {
      const d = new Date(key + 'T12:00:00Z')
      if (Number.isNaN(d.getTime())) return key
      return `${WD[d.getUTCDay()]}, ${d.getUTCDate()} de ${MO[d.getUTCMonth()]}`
    }
    function fmtMonthYear(iso) {
      const d = new Date(iso)
      return Number.isNaN(d.getTime()) ? '' : `${MO[d.getMonth()]} de ${d.getFullYear()}`
    }

    const firstName = n => String(n || '').trim().split(/\s+/)[0] || ''
    const branded = () => provider && provider.show_branding !== false

    function waUrl(phone, text) {
      let d = String(phone || '').replace(/\D/g, '')
      if (d.length === 10) d = '1' + d
      if (d.length < 11) return ''
      return `https://wa.me/${d}${text ? '?text=' + encodeURIComponent(text) : ''}`
    }
    function igUrl(handle) {
      let h = String(handle || '').trim()
      const m = h.match(/instagram\.com\/([^/?#\s]+)/i)
      if (m) h = m[1]
      h = h.replace(/^@+/, '').replace(/\/+$/, '')
      return /^[A-Za-z0-9._]{1,30}$/.test(h) ? `https://instagram.com/${h}` : ''
    }
    // YouTube e Vimeo viram player; outro link vira botao
    function videoEmbed(url) {
      const u = httpUrl(url)
      if (!u) return ''
      const yt = u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/i)
      if (yt) return `https://www.youtube.com/embed/${yt[1]}`
      const vm = u.match(/vimeo\.com\/(?:video\/)?(\d+)/i)
      if (vm) return `https://player.vimeo.com/video/${vm[1]}`
      return ''
    }
    function starsHtml(n) {
      const full = Math.max(0, Math.min(5, Math.round(Number(n) || 0)))
      return `<span class="stars" aria-label="${full} de 5 estrelas">${'★'.repeat(full)}<span class="off">${'★'.repeat(5 - full)}</span></span>`
    }
    const fmtAvg = v => (v == null ? '' : Number(v).toFixed(1).replace('.', ','))

    function siteHeader() {
      if (!branded()) return ''
      return `
        <header class="site-header">
          <div class="container">
            <a class="bc-logo" href="/">Brasil<em>Connect</em></a>
            <nav class="site-nav"><a href="/agenda/">AgendaPro</a><a href="/">Início</a></nav>
          </div>
        </header>`
    }
    function siteFooter() {
      if (!branded()) return ''
      return `<footer class="pro-foot">Agenda online por <a href="/para/agenda-pro/">AgendaPro</a> · BrasilConnect</footer>`
    }

    // Voltou do Stripe depois de pagar (ou desistir) do sinal
    function paidBanner() {
      const q = new URLSearchParams(location.search)
      const box = 'border-radius:12px;padding:14px 18px;font-size:14px;margin:24px 0 8px;'
      if (q.get('paid') === '1') return `<div style="${box}background:var(--green-soft);color:var(--green-deep);"><strong>Sinal pago.</strong> Seu horário está confirmado.</div>`
      if (q.get('canceled') === '1') return `<div style="${box}background:var(--gold-soft);color:var(--ink-soft);">O pagamento do sinal não foi concluído. O horário fica reservado, mas só confirma com o sinal. Fale com a profissional pra combinar.</div>`
      return ''
    }

    async function loadProvider(slug) {
      try {
        const r = await fetch(`/api/agenda/provider?slug=${encodeURIComponent(slug)}`)
        if (!r.ok) throw new Error('not_found')
        const data = await r.json()
        provider = data.provider
        services = data.services || []
        reviews = data.reviews || { count: 0, average: null, items: [] }
        quoteForm = await quoteFormFor(provider)
        const what = quoteForm ? 'Pedir orçamento' : 'Agendar'
        document.title = branded() ? `${provider.name} — ${what} | BrasilConnect` : `${provider.name} — ${what}`
        renderProfile()
      } catch (e) {
        root.innerHTML = `<div style="padding:60px;text-align:center;"><h1>Profissional não encontrada</h1><p>O perfil <code>${escapeHtml(slug)}</code> não existe ou está inativo.</p><p><a href="/agenda/">Ver todos os profissionais</a></p></div>`
      }
    }

    function gallery() {
      return (provider.gallery_urls || []).map(httpUrl).filter(Boolean)
    }

    function renderProfile() {
      const initials = provider.name.split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase()
      const open = provider.booking_enabled !== false
      const photos = gallery()
      const ig = igUrl(provider.instagram)
      const hasReviews = (reviews.count || 0) > 0 && (reviews.items || []).length > 0
      const wa = waUrl(provider.whatsapp, quoteForm
        ? `Oi ${firstName(provider.name)}! Vi sua página e queria pedir um orçamento.`
        : `Oi ${firstName(provider.name)}! Vi sua página e queria marcar um horário.`)

      // Agenda online (igual pra todos). No tipo 'trades' com orçamento, fica abaixo do
      // formulário e só aparece se houver serviços cadastrados.
      const bookingBlock = `
              <div class="step-eyebrow">${open ? (quoteForm ? 'AGENDAR UM HORÁRIO · ESCOLHA O SERVIÇO' : 'PASSO 1 · ESCOLHA O SERVIÇO') : 'SERVIÇOS E PREÇOS'}</div>
              ${quoteForm ? '' : paidBanner()}
              ${open ? '' : closedBox(wa, ig)}
              <div id="services-list">${services.length === 0 ? '<p class="muted">Sem serviços cadastrados ainda.</p>' : services.map(s => serviceCard(s, open)).join('')}</div>
              <div id="step2" style="display:none;"></div>
              <div id="step3" style="display:none;"></div>
              <div id="step4" style="display:none;"></div>`
      const mainTop = quoteForm
        ? `${paidBanner()}${quoteSection()}${services.length ? `<div class="page-section" id="agendar">${bookingBlock}</div>` : ''}`
        : bookingBlock

      const links = [
        quoteForm ? `<a class="pill" href="#orcamento">Pedir orçamento</a>` : '',
        hasReviews ? `<a class="pill" href="#avaliacoes"><span class="gold">★</span> ${fmtAvg(reviews.average)} · ${reviews.count} ${reviews.count === 1 ? 'avaliação' : 'avaliações'}</a>` : '',
        photos.length ? `<a class="pill" href="#trabalhos">Ver trabalhos</a>` : '',
        ig ? `<a class="pill" href="${escapeHtml(ig)}" target="_blank" rel="noopener">Instagram</a>` : '',
      ].filter(Boolean).join('')

      root.innerHTML = `
        ${siteHeader()}

        <section class="pro-cover" id="cover">
          <div class="container">
            <div class="avatar-circle" id="avatar">${escapeHtml(initials)}</div>
            <div>
              <h1>${escapeHtml(provider.name)}</h1>
              ${provider.specialty ? `<div class="specialty">${escapeHtml(provider.specialty)}</div>` : ''}
              ${provider.city ? `<div class="specialty" style="font-size:0.9rem;">${escapeHtml(provider.city)}${provider.state ? ', ' + escapeHtml(provider.state) : ''}</div>` : ''}
              ${provider.bio ? `<p class="bio">${escapeHtml(provider.bio)}</p>` : ''}
              ${links ? `<div class="cover-links">${links}</div>` : ''}
            </div>
          </div>
        </section>

        <main>
          <section>
            <div class="container-narrow">
              ${mainTop}

              ${photos.length ? `
                <div class="page-section" id="trabalhos">
                  <div class="step-eyebrow">TRABALHOS</div>
                  <div class="gallery-grid">${photos.map((u, i) => `<button type="button" data-photo="${i}" aria-label="Ver foto ${i + 1}"><img src="${escapeHtml(u)}" alt="Trabalho de ${escapeHtml(provider.name)}" loading="lazy"></button>`).join('')}</div>
                </div>` : ''}

              ${videoSection()}

              ${hasReviews ? reviewsSection() : ''}

              ${(open && wa) || ig ? `
                <div class="page-section">
                  <div class="step-eyebrow">FALE COM ${escapeHtml(firstName(provider.name).toUpperCase())}</div>
                  <div class="contact-row">
                    ${open && wa ? `<a class="btn btn-whatsapp" href="${escapeHtml(wa)}" target="_blank" rel="noopener">Tirar dúvida no WhatsApp</a>` : ''}
                    ${ig ? `<a class="btn btn-secondary" href="${escapeHtml(ig)}" target="_blank" rel="noopener">Ver no Instagram</a>` : ''}
                  </div>
                </div>` : ''}
            </div>
          </section>
        </main>

        ${siteFooter()}
      `

      // Fotos por JS (url() dentro de style quebra com aspas no link)
      const cover = httpUrl(provider.cover_url)
      if (cover) {
        document.getElementById('cover').style.backgroundImage =
          `linear-gradient(135deg, rgba(20,53,39,0.72) 0%, rgba(20,53,39,0.88) 100%), url(${JSON.stringify(cover)})`
      }
      const avatar = httpUrl(provider.avatar_url)
      if (avatar) {
        const el = document.getElementById('avatar')
        el.style.backgroundImage = `url(${JSON.stringify(avatar)})`
        el.classList.add('has-photo')
      }

      document.querySelectorAll('[data-photo]').forEach(b => { b.onclick = () => openLightbox(Number(b.dataset.photo)) })
      if (quoteForm) wireQuoteForm()

      if (!open) return
      services.forEach(s => {
        const el = document.querySelector(`[data-svc="${s.id}"]`)
        if (el) el.onclick = () => selectService(s)
      })
    }

    // ── Pedir orçamento ───────────────────────────────────────────────────
    // provider.quote_requests_enabled (api/agenda/provider.js) decide; sem o campo, pergunta
    // pra rota dos pedidos (mesma regra) e, se ela falhar, mostra pro tipo 'trades'.
    async function quoteFormFor(p) {
      if (!p) return false
      if (typeof p.quote_requests_enabled === 'boolean') return p.quote_requests_enabled
      try {

    // Erro do servidor → texto no idioma do formulário. Pelo code; servidor que só manda
    // code 'invalid' + frase em português: acha o tipo pela frase.
    const QF_CODES = {
      rate_limited: 'e_rate', disabled: 'e_off', name: 'e_name', invalid_name: 'e_name', contact: 'e_contact',
      phone: 'e_phone', invalid_phone: 'e_phone', email: 'e_email', invalid_email: 'e_email',
      date: 'e_date', invalid_date: 'e_date', date_past: 'e_date_past', date_far: 'e_date_far',
      photo_big: 'e_photo_big', photo_format: 'e_photo', photos: 'e_photo', photos_max: 'e_max',
    }
    const QF_MSGS = [
      [/a partir de hoje/i, 'e_date_past'], [/data mais próxima/i, 'e_date_far'], [/^data inválida/i, 'e_date'],
      [/telefone ou e-mail/i, 'e_contact'], [/^telefone/i, 'e_phone'], [/^e-mail inválido/i, 'e_email'],
      [/seu nome/i, 'e_name'], [/grande demais/i, 'e_photo_big'], [/^fotos? inválida/i, 'e_photo'], [/no máximo/i, 'e_max'],
    ]
    function qfErrorKey(status, data) {
      if (status === 429) return 'e_rate'
      if (status === 403) return 'e_off'
      const code = data && data.code
      if (code && QF_CODES[code]) return QF_CODES[code]
      const msg = String((data && data.error) || '')
      const hit = QF_MSGS.find(([re]) => re.test(msg))
      return hit ? hit[1] : null
    }

    // Foto do celular → JPEG abaixo de ~480 KB (o servidor aceita até 500 KB)
    async function compressImage(file) {
      const url = URL.createObjectURL(file)
      try {
        const img = await new Promise((resolve, reject) => { const i = new Image(); i.onload = () => resolve(i); i.onerror = reject; i.src = url })
        const W = img.naturalWidth, H = img.naturalHeight
        if (!W || !H) return null
        for (const maxSide of [1600, 1280, 1024, 800]) {
          const scale = Math.min(1, maxSide / Math.max(W, H))
          const c = document.createElement('canvas')
          c.width = Math.max(1, Math.round(W * scale)); c.height = Math.max(1, Math.round(H * scale))
          const ctx = c.getContext('2d')
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height)
          ctx.drawImage(img, 0, 0, c.width, c.height)
          for (const q of [0.82, 0.7, 0.6, 0.5]) {
            const data = c.toDataURL('image/jpeg', q)
            const bytes = Math.floor((data.length - data.indexOf(',') - 1) * 3 / 4)
            if (data.startsWith('data:image/jpeg') && bytes <= 480 * 1024) return data
          }
        }
        return null
      } catch (_) {
        return null
      } finally {
        URL.revokeObjectURL(url)
      }
    }

    async function addPhotos(files) {
      const err = document.getElementById('qfErr')
      const send = document.getElementById('qfSend')
      const list = Array.from(files || [])
      if (!list.length) return
      if (qfState.photos.length + list.length > 3) err.textContent = qt('e_max')
      else err.textContent = ''
      send.disabled = true
      const label = send.textContent
      send.textContent = qt('compressing')
      for (const file of list.slice(0, 3 - qfState.photos.length)) {
        if (!/^image\//.test(file.type || 'image/')) { err.textContent = qt('e_photo'); continue }
        const data = await compressImage(file)
        if (data) qfState.photos.push(data)
        else err.textContent = qt('e_photo')
      }
      send.disabled = false
      send.textContent = label
      renderThumbs()
    }

    async function sendQuote() {
      if (qfState.busy) return
      const v = formValues()
      const err = document.getElementById('qfErr')
      const btn = document.getElementById('qfSend')
      err.textContent = ''
      const name = v.name.replace(/\s+/g, ' ').trim()
      const phone = v.phone.trim(), email = v.email.trim()
      if (name.length < 2) { err.textContent = qt('e_name'); document.getElementById('qfName').focus(); return }
      if (!phone && !email) { err.textContent = qt('e_contact'); document.getElementById('qfPhone').focus(); return }
      if (phone && phone.replace(/\D/g, '').length < 10) { err.textContent = qt('e_phone'); document.getElementById('qfPhone').focus(); return }
      if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { err.textContent = qt('e_email'); document.getElementById('qfEmail').focus(); return }

      qfState.busy = true
      btn.disabled = true
      const label = btn.textContent
      btn.textContent = qt('sending')
      try {
        const r = await fetch('/api/agenda/quote-requests', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            slug: provider.slug, name, phone, email,
            address: v.address.trim(), service: v.service.trim(), description: v.description.trim(),
            preferred_date: v.preferred_date || null, language: qfState.lang, photos: qfState.photos,
            website: (document.getElementById('qfWebsite') || {}).value || '',
          }),
        })
        const data = await r.json().catch(() => ({}))
        if (!r.ok) {
          const key = qfErrorKey(r.status, data)
          err.textContent = key ? qt(key) : (qfState.lang === 'pt' && data.error) ? data.error : qt('e_generic')
          if (key && key.startsWith('e_date')) document.getElementById('qfDate').focus()
          qfState.busy = false
          btn.disabled = false
          btn.textContent = label
          return
        }
        qfState.photos = []
        qfState.busy = false
        // Foto que o servidor não conseguiu salvar: o pedido foi, mas avisa pra mandar por fora
        quoteDone(name, Math.max(0, Math.round(Number(data.photos_failed) || 0)))
      } catch (_) {
        err.textContent = qt('e_generic')
        qfState.busy = false
        btn.disabled = false
        btn.textContent = label
      }
    }

    // Foto grande com setas, teclado e arrastar no celular
    function openLightbox(start) {
      const urls = gallery()
      if (!urls.length) return
      let idx = start
      const box = document.createElement('div')
      box.className = 'lightbox'
      box.setAttribute('role', 'dialog')
      box.setAttribute('aria-label', 'Foto do trabalho')
      box.innerHTML = `<button type="button" class="lb-close" aria-label="Fechar">×</button>
        ${urls.length > 1 ? '<button type="button" class="lb-prev" aria-label="Foto anterior">‹</button><button type="button" class="lb-next" aria-label="Próxima foto">›</button>' : ''}
        <img alt="Trabalho de ${escapeHtml(provider.name)}"><div class="lb-count"></div>`
      const img = box.querySelector('img')
      const count = box.querySelector('.lb-count')
      const show = () => { img.src = urls[idx]; count.textContent = urls.length > 1 ? `${idx + 1} / ${urls.length}` : '' }
      const go = d => { idx = (idx + d + urls.length) % urls.length; show() }
      const onKey = e => {
        if (e.key === 'Escape') close()
        else if (e.key === 'ArrowLeft') go(-1)
        else if (e.key === 'ArrowRight') go(1)
      }
      function close() {
        box.remove()
        document.removeEventListener('keydown', onKey)
        document.body.style.overflow = ''
      }
      box.addEventListener('click', e => { if (e.target === box || e.target.classList.contains('lb-close')) close() })
      const prev = box.querySelector('.lb-prev'), next = box.querySelector('.lb-next')
      if (prev) prev.onclick = e => { e.stopPropagation(); go(-1) }
      if (next) next.onclick = e => { e.stopPropagation(); go(1) }
      let x0 = null
      box.addEventListener('touchstart', e => { x0 = e.touches[0].clientX }, { passive: true })
      box.addEventListener('touchend', e => {
        if (x0 == null) return
        const dx = e.changedTouches[0].clientX - x0
        if (Math.abs(dx) > 40 && urls.length > 1) go(dx < 0 ? 1 : -1)
        x0 = null
      })
      document.addEventListener('keydown', onKey)
      document.body.style.overflow = 'hidden'
      document.body.appendChild(box)
      show()
      box.querySelector('.lb-close').focus()
    }

              <div class="name">${escapeHtml(s.name)}</div>
              ${s.category ? `<div class="meta"><span>${escapeHtml(s.category)}</span> · <span>${s.duration_min} min</span></div>` : `<div class="meta">${s.duration_min} min</div>`}
              ${s.description ? `<div style="font-size:13px;color:var(--ink-muted);margin-top:6px;">${escapeHtml(s.description)}</div>` : ''}
            </div>
            <div style="text-align:right;">
              <div class="price">${fmtUSD(s.price_cents)}</div>
              ${s.deposit_cents > 0 ? `<div style="font-size:11px;color:var(--brand-gold-dark);">Depósito ${fmtUSD(s.deposit_cents)}</div>` : ''}
            </div>
          </div>
        </div>
      `
    }

    async function selectService(s) {
      selected.service = s
      document.querySelectorAll('.service-card').forEach(c => c.classList.remove('selected'))
      document.querySelector(`[data-svc="${s.id}"]`).classList.add('selected')
      renderStep2()
    }

    function renderStep2() {
      const today = localKey(new Date())
      const max = localKey(new Date(Date.now() + 60 * 24 * 3600 * 1000))
      // Trocou o serviço: some o resumo do serviço anterior
      selected.date = null; selected.slot = null
      const step4 = document.getElementById('step4')
      step4.style.display = 'none'; step4.innerHTML = ''
      document.getElementById('step2').style.display = 'block'
      document.getElementById('step2').innerHTML = `
        <div class="step-eyebrow">PASSO 2 · ESCOLHA A DATA</div>
        <input type="date" id="dateInput" class="date-input" min="${today}" max="${max}" />
        <div id="slots-area"></div>
      `
      document.getElementById('dateInput').onchange = e => loadSlots(e.target.value)
    }

    // Plano da profissional nao libera agendamento online (availability → booking_open: false)
    function closedSlots() {
      const name = escapeHtml(firstName(provider.name) || provider.name)
      const wa = waUrl(provider.whatsapp, `Oi ${firstName(provider.name)}! Vi sua página e queria marcar um horário${selected.service ? ` (${selected.service.name})` : ''}.`)
      return `
        <div class="closed-box" style="margin-top:16px;">
          <strong>Agenda fechada no momento.</strong><br>
          ${wa ? `Fale direto com ${name} pelo WhatsApp pra marcar seu horário.` : `Volte em breve pra marcar seu horário com ${name}.`}
          ${wa ? `<div><a class="btn btn-whatsapp" href="${escapeHtml(wa)}" target="_blank" rel="noopener" style="margin-top:14px;">Chamar no WhatsApp</a></div>` : ''}
        </div>`
    }

    async function loadSlots(date) {
      selected.date = date
      selected.slot = null
      const step4 = document.getElementById('step4')
      step4.style.display = 'none'; step4.innerHTML = ''
      const area = document.getElementById('slots-area')
      area.innerHTML = '<p class="muted" style="font-size:14px;">Carregando horários…</p>'
      try {
        const r = await fetch(`/api/agenda/availability?provider_id=${provider.id}&date=${date}&duration=${selected.service.duration_min}`)
        const data = await r.json()
        if (data.booking_open === false) {
          area.innerHTML = closedSlots()
          return
        }
        if (!data.slots || data.slots.length === 0) {
          area.innerHTML = '<p class="muted" style="font-size:14px;">Nenhum horário disponível neste dia.</p>'
          return
        }
        area.innerHTML = `<div class="step-eyebrow" style="margin-top:24px;">PASSO 3 · ESCOLHA O HORÁRIO</div>
          <div class="slot-grid">${data.slots.map(s => `<button class="slot-btn" data-slot="${s}">${s}</button>`).join('')}</div>`
        document.querySelectorAll('.slot-btn').forEach(b => b.onclick = () => selectSlot(b.dataset.slot))
      } catch (e) {
        area.innerHTML = '<p class="muted" style="font-size:14px;color:#9F2D2D;">Erro ao carregar horários.</p>'
      }
    }

    function selectSlot(slot) {
      selected.slot = slot
      document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'))
      document.querySelector(`[data-slot="${slot}"]`).classList.add('selected')
      renderStep4()
    }

    function renderStep4() {
      document.getElementById('step4').style.display = 'block'
      document.getElementById('step4').innerHTML = `
        <div class="step-eyebrow">PASSO 4 · CONFIRMAR</div>
        <div class="card" style="margin-bottom:16px;">
          <div style="font-family:var(--font-display);font-size:1.2rem;color:var(--ink);">${escapeHtml(selected.service.name)}</div>
          <div style="color:var(--ink-soft);font-size:14px;margin-top:6px;">${fmtDateBR(selected.date)} · ${selected.slot} · ${selected.service.duration_min} min</div>
          <div style="font-family:var(--font-display);font-size:1.4rem;font-weight:700;color:var(--ink);margin-top:10px;">${fmtUSD(selected.service.price_cents)}</div>
          ${selected.service.deposit_cents > 0 ? `<div style="font-size:12px;color:var(--brand-gold-dark);margin-top:4px;">Depósito antecipado: ${fmtUSD(selected.service.deposit_cents)} (descontado do valor total)</div>` : ''}
        </div>
        <input id="cName" type="text" placeholder="Seu nome" autocomplete="name" style="width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:8px;font-family:inherit;font-size:14px;" required />
        <input id="cWa" type="tel" placeholder="WhatsApp (com DDD)" autocomplete="tel" style="width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:8px;font-family:inherit;font-size:14px;" />
        <input id="cEmail" type="email" autocomplete="email" placeholder="E-mail (pra receber confirmação e lembrete)" style="width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:8px;font-family:inherit;font-size:14px;" />
        <textarea id="cNotes" placeholder="Observações (opcional)" rows="3" style="width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:14px;font-family:inherit;font-size:14px;"></textarea>
        <button id="bookBtn" class="btn btn-primary" style="width:100%;justify-content:center;">Confirmar agendamento →</button>
        <p id="bookErr" style="color:#9F2D2D;font-size:13px;text-align:center;margin-top:10px;display:none;"></p>
      `
      document.getElementById('bookBtn').onclick = doBook
    }

    async function doBook() {
      const name = document.getElementById('cName').value.trim()
      const wa = document.getElementById('cWa').value.trim()
      const email = document.getElementById('cEmail').value.trim()
      const notes = document.getElementById('cNotes').value.trim()
      const err = document.getElementById('bookErr')
      if (!name) { err.textContent = 'Nome é obrigatório'; err.style.display = 'block'; return }
      if (!wa && !email) { err.textContent = 'Informe WhatsApp ou e-mail pra contato'; err.style.display = 'block'; return }
      const btn = document.getElementById('bookBtn')
      btn.disabled = true; btn.textContent = 'Confirmando…'
      try {
        const sched = `${selected.date}T${selected.slot}:00`
        const r = await fetch('/api/agenda/book', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            provider_id: provider.id,
            service_id: selected.service.id,
            scheduled_for: sched,
            client_name: name, client_whatsapp: wa, client_email: email, client_notes: notes,
          })
        })
        const data = await r.json()
        if (!r.ok) throw new Error(data.error || 'Erro ao agendar')

        if (data.requires_deposit && data.accepts_card) {
          // O agendamento ja existe (pendente). Se o pagamento nao abrir, NAO repete o
          // agendamento: mostra a tela de pendente com a instrucao da profissional.
          try {
            const co = await fetch('/api/agenda/checkout', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ appointment_id: data.appointment_id }),
            })
            const co2 = await co.json()
            if (co2.checkout_url) { window.location = co2.checkout_url; return }
            if (co2.deposit_instructions) data.deposit_instructions = co2.deposit_instructions
          } catch (_) {}
          data.card_failed = true
        }
        renderSuccess(data, name, email)
      } catch (e) {
        err.textContent = e.message; err.style.display = 'block'
        btn.disabled = false; btn.textContent = 'Confirmar agendamento →'
      }
    }

    function renderSuccess(data, name, email) {
      const pending = !!data.requires_deposit
      root.innerHTML = `
        ${branded() ? `<header class="site-header">
          <div class="container"><a class="bc-logo" href="/">Brasil<em>Connect</em></a></div>
        </header>` : ''}
        <main>
          <section><div class="container-narrow" style="text-align:center; padding-top:80px;">
            <div style="text-transform:uppercase;letter-spacing:0.18em;font-size:11px;font-weight:600;color:var(--brand-gold-dark);margin-bottom:12px;">${pending ? 'FALTA O SINAL' : 'CONFIRMADO'}</div>
            <h1 style="font-family:var(--font-display);">${pending ? 'Horário reservado' : 'Agendamento marcado'}, ${escapeHtml(name)}!</h1>
            <p class="lede">Você fica com <strong>${escapeHtml(provider.name)}</strong> em ${fmtDateBR(selected.date)} às ${selected.slot} — ${escapeHtml(selected.service.name)}.</p>
            ${pending ? `<p class="muted">O horário é confirmado quando ${escapeHtml(provider.name)} receber o sinal de <strong>${fmtUSD(data.deposit_cents)}</strong>.${data.card_failed ? ' Não conseguimos abrir o pagamento no cartão agora.' : ''}</p>
            ${data.deposit_instructions ? `<p class="lede" style="font-size:1rem;">Como pagar: <strong>${escapeHtml(data.deposit_instructions)}</strong></p>` : `<p class="muted">Combine o pagamento do sinal direto com ${escapeHtml(provider.name)}.</p>`}` : ''}
            <p class="muted">${email ? 'Mandamos a confirmação pro seu e-mail. O lembrete chega 24 horas antes do horário.' : 'Anote a data e o horário: sem e-mail, não conseguimos mandar lembrete.'}</p>
            <a href="/agenda/${escapeHtml(provider.slug)}" class="btn btn-secondary" style="margin-top:20px;">Voltar pro perfil</a>
          </div></section>
        </main>
        ${siteFooter()}
      `
      window.scrollTo(0, 0)
    }
  </script>
</body>
</html>
