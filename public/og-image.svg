<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Imagem de compartilhamento (Open Graph). O PNG e gerado a partir deste arquivo:
       node scripts/build-og-image.mjs -->
  <rect width="1200" height="630" fill="#1F4D3F"/>
  <circle cx="1010" cy="120" r="420" fill="#009C3B" opacity="0.16"/>

  <!-- Marca -->
  <g transform="translate(80,64)">
    <g transform="scale(0.32)">
      <rect width="200" height="200" fill="#009C3B" rx="24"/>
      <path d="M 44 56 L 156 100 L 44 144" fill="none" stroke="#FFDF00" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="84" cy="100" r="22" fill="#002776"/>
    </g>
    <text x="84" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#FAF7F0">Brasil<tspan fill="#FFDF00" font-style="italic" font-weight="400">Connect</tspan></text>
  </g>

  <!-- Chamada -->
  <text x="80" y="216" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#B8943B" letter-spacing="4">BRASILEIROS NOS ESTADOS UNIDOS</text>
  <text font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="700" fill="#FAF7F0" letter-spacing="-2.5">
    <tspan x="80" y="312">Sua vida aqui,</tspan>
    <tspan x="80" y="402" fill="#FFDF00">resolvida</tspan>
    <tspan x="80" y="492">num lugar só.</tspan>
  </text>

  <!-- Simbolo grande -->
  <g transform="translate(850,200) scale(1.3)" opacity="0.98">
    <rect width="200" height="200" fill="#009C3B" rx="28"/>
    <path d="M 44 56 L 156 100 L 44 144" fill="none" stroke="#FFDF00" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="84" cy="100" r="22" fill="#002776"/>
  </g>

  <text x="80" y="566" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#FAF7F0" opacity="0.82">Câmbio e remessas  ·  Voos  ·  Negócios brasileiros  ·  Guias</text>
  <rect x="0" y="618" width="1200" height="12" fill="#FFDF00"/>
</svg>
