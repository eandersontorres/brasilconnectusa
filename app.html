<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/img/logo-mark.svg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://brasilconnectusa.com/app" />

    <!-- ── Fontes: SF Pro/Inter no app; Fraunces só no logo ────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- ── SEO básico ─────────────────────────────────────────────── -->
    <title>App · BrasilConnect USA — Comunidade brasileira nos EUA</title>
    <meta name="description" content="Acesse o app BrasilConnect USA: feed da comunidade, comparador de remessas, voos pro Brasil, diretório de negócios brasileiros e mais." />
    <meta name="keywords" content="brasileiros nos EUA, remessa para o Brasil, câmbio dólar real, voos Brasil, comunidade brasileira EUA, negócios brasileiros, custo de vida EUA" />
    <meta name="author" content="BrasilConnect USA" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#009C3B" />
    <meta name="language" content="Portuguese" />

    <!-- ── Open Graph (Facebook, WhatsApp, LinkedIn) ──────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BrasilConnect USA" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:url" content="https://brasilconnectusa.com/app" />
    <meta property="og:title" content="App · BrasilConnect USA" />
    <meta property="og:description" content="Feed, remessas, voos e negócios brasileiros nos EUA." />
    <meta property="og:image" content="https://brasilconnectusa.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="BrasilConnect USA — plataforma para brasileiros nos EUA" />

    <!-- ── Twitter Card ───────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BrasilConnect USA" />
    <meta name="twitter:description" content="Remessas, câmbio, voos e comunidade brasileira nos EUA." />
    <meta name="twitter:image" content="https://brasilconnectusa.com/og-image.png" />

    <!-- ── PWA / Apple ────────────────────────────────────────────── -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BrasilConnect" />
    <meta name="format-detection" content="telephone=no" />

    <!-- ── JSON-LD Organization ───────────────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "BrasilConnect USA",
      "alternateName": "BrasilConnect",
      "url": "https://brasilconnectusa.com",
      "logo": "https://brasilconnectusa.com/logo.png",
      "description": "Plataforma para brasileiros nos EUA: remessas, câmbio, voos e comunidade.",
      "areaServed": [
        { "@type": "Country", "name": "United States" },
        { "@type": "Country", "name": "Brazil" }
      ],
      "sameAs": [
        "https://www.instagram.com/brasilconnectusa",
        "https://www.facebook.com/brasilconnectusa"
      ]
    }
    </script>

    <!-- ── JSON-LD WebSite + SearchAction ─────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "BrasilConnect USA",
      "url": "https://brasilconnectusa.com",
      "inLanguage": "pt-BR",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://brasilconnectusa.com/buscar?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Analytics (GA4 / Meta Pixel): so carrega com consentimento. Ver public/js/site.js -->
    <script src="/js/site.js" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
